<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmailJS Diagnostic Test</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init({
              publicKey: "cWk6e-AgL7WNdeBLD",
            });
        })();
    </script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #1a1a1a; color: white; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        #output { margin-top: 30px; font-size: 16px; padding: 20px; background: #2a2a2a; border-radius: 5px; display: inline-block; text-align: left; max-width: 600px; white-space: pre-wrap;}
    </style>
</head>
<body>

    <h2>EmailJS Diagnostic Tool</h2>
    <p>This will test your exact credentials and show the exact error message if it fails.</p>
    
    <button onclick="testEmail()">Send Test Email to Andy</button>

    <div id="output">Waiting for test...</div>

    <script>
        async function testEmail() {
            const output = document.getElementById('output');
            output.innerText = "Sending... Please wait...";
            
            try {
                const response = await emailjs.send("service_n8nt0he", "template_brzersu", {
                    to_email: "andyharris9890@gmail.com",
                    to_name: "Andy Harris (Diagnostic)",
                    tracking_number: "AC-DIAGNOSTIC",
                    status: "Testing System",
                    location: "System Test",
                    description: "This is a direct diagnostic test."
                });
                output.style.color = "#00ff00";
                output.innerText = "SUCCESS! Email sent successfully.\n\nResponse details:\n" + JSON.stringify(response, null, 2);
            } catch (err) {
                output.style.color = "#ff4d4d";
                output.innerText = "ERROR! Failed to send.\n\n" + 
                                 "Reason: " + (err.text || err.message || JSON.stringify(err)) + "\n\n" +
                                 "Status Code: " + (err.status || 'N/A');
            }
        }
    </script>
</body>
</html>
